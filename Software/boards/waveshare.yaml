# Board declaration. GENERATED ONCE from the header of the same name;
# from here on this file is the source and tools/board_gen.py rebuilds
# the generated fragments from it. Pins whose GPIO depends on a runtime
# user setting or a hardware variant stay hand-written in the board
# header; they are listed under conditional_pins so that capability
# validation still knows the role exists.
board: waveshare
class: WaveshareS3Rs485CanHal
header: hw_waveshare.h
name: "Waveshare ESP32-S3-RS485-CAN"
pins:
  CAN_TX_PIN: 15
  CAN_RX_PIN: 16
  CAN_SE_PIN: NC
  RS485_TX_PIN: 17
  RS485_RX_PIN: 18
  RS485_DE_PIN: 21
  RS485_EN_PIN: NC
  RS485_SE_PIN: NC
  PIN_5V_EN: NC
  POSITIVE_CONTACTOR_PIN: 3
  NEGATIVE_CONTACTOR_PIN: 4
  PRECHARGE_PIN: 5
  BMS_POWER: 6
  SECOND_BATTERY_CONTACTORS_PIN: 8
  EQUIPMENT_STOP_PIN: 7
  WUP_PIN1: 8
  AP_BUTTON_PIN: 0
  HIA4V1_PIN: 5
  INVERTER_DISCONNECT_CONTACTOR_PIN: 3
  INVERTER_CONTACTOR_ENABLE_PIN: 9
  MCP2517_SCK: 10
  MCP2517_SDI: 11
  MCP2517_SDO: 12
  MCP2517_CS: 13
