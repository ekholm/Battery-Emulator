# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: waveshare
class: WaveshareS3Rs485CanHal
header: hw_waveshare.h
macro: HW_WAVESHARE
name: "Waveshare ESP32-S3-RS485-CAN"
buses:
  SPI1: {clk: 10, mosi: 11, miso: 12}
rs485:
  - {tx: 17, rx: 18, en: NC, se: NC, de: 21, power_5v_en: NC}
can:
  - {driver: native, tx: 15, rx: 16, se: NC}
  - {driver: mcp2518fd, bus: SPI1, cs: 13, int: 14}
contactors:
  - {positive: 3, negative: 4, precharge: 5, bms_power: 6, second: 8}
precharge_auto:
  - {hia4v1: 5, inverter_disconnect: 3}
sma:
  - {enable: 9}
rgb_led:
  - {pin: setting}
equipment_stop:
  - {pin: 7}
battery_wakeup:
  - {wup1: 8, wup2: 9}
ap_button:
  - {pin: 0}
display_i2c:
  - {sda: setting, scl: setting}
comments:
  WUP_PIN2: "//Collides with SMA contactor input"
