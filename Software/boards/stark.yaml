# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: stark
class: StarkHal
header: hw_stark.h
name: "Stark CMR Module"
buses:
  SPI1: {clk: variant, mosi: 5, miso: 34}
rs485:
  - {tx: 22, rx: 21, en: NC, se: NC, power_5v_en: NC}
can:
  - {driver: native, tx: 27, rx: 26, se: NC}
  - {driver: mcp2518fd, bus: SPI1, cs: 18, int: 35, freq: 40000000}
  - {driver: mcp2518fd, bus: SPI1, cs: 12, int: 14}
contactors:
  - {positive: 32, negative: 33, precharge: setting, bms_power: setting, second: 19, third: 15}
precharge_auto:
  - {hia4v1: 19, inverter_disconnect: 25}
sma:
  - {enable: 2}
rgb_led:
  - {pin: 4, count: 5, max_brightness: 20}
equipment_stop:
  - {pin: 2}
battery_wakeup:
  - {wup1: 25, wup2: 32}
ap_button:
  - {pin: 0}
# Product-labelled power outputs, from the SCMR02 v1.1 manual. Stage 1 records
# them; nothing reads them yet. Output 4 is high unless software drives it,
# which matters because GPIOOPT5 can put PRECHARGE_PIN on it.
outputs:
  - {label: "Output 1", gpio: 25, driver: relay, notes: "7 A cont / 12 A max, needs >=10 VDC to actuate, green LED"}
  - {label: "Output 2", gpio: 33, driver: mosfet, notes: "0.65/1.4 A, PWM-capable, yellow LED"}
  - {label: "Output 3", gpio: 32, driver: mosfet, notes: "0.65/1.4 A, PWM-capable, orange LED"}
  - {label: "Output 4", gpio: 23, driver: mosfet, boot_state: high, notes: "0.65/1.4 A, PWM-capable, red LED, ON unless driven"}
