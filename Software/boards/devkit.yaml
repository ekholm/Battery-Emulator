# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: devkit
class: DevKitHal
header: hw_devkit.h
macro: HW_DEVKIT
name: "ESP32 DevKit V1"
buses:
  SPI1: {clk: 22, mosi: 21, miso: 19}
  SPI2: {clk: 33, mosi: 32, miso: 35}
rs485:
  - {tx: 1, rx: 3}
can:
  - {driver: native, tx: 27, rx: 26}
  - {driver: mcp2515, bus: SPI1, cs: 18, int: 23}
  - {driver: mcp2518fd, bus: SPI2, cs: 25, int: 34}
contactors:
  - {positive: 5, negative: 16, precharge: 17, second: 32, third: NC}
precharge_auto:
  - {hia4v1: 4, inverter_disconnect: 5}
sma:
  - {enable: 14, led: 2}
rgb_led:
  - {pin: 4, max_brightness: 40}
equipment_stop:
  - {pin: 12}
battery_wakeup:
  - {wup1: 25, wup2: 32}
ap_button:
  - {pin: 0}
