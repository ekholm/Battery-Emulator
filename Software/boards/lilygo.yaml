# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: lilygo
class: LilyGoHal
header: hw_lilygo.h
macro: HW_LILYGO
chip: esp32
flash_mb: 4
name: "LilyGo T-CAN485"
buses:
  SPI1: {clk: 12, mosi: 5, miso: 34}
rs485:
  - {tx: 22, rx: 21, en: 17, se: 19, power_5v_en: 16}
can:
  - {driver: native, tx: 27, rx: 26, se: 23}
  # Alternative fitments of the same header - only one is ever plugged in, which
  # is why they share cs/int. Naming the add-on checks the wiring against what
  # the module actually needs.
  - {driver: mcp2515, bus: SPI1, cs: 18, int: 35, addon: mcp2515}
  - {driver: mcp2518fd, bus: SPI1, cs: 18, int: 35, addon: mcp2518fd}
chademo:
  - {pin2: 12, pin10: 5, pin7: 34, pin4: 35, lock: 18, ct: 15}
contactors:
  # bms_power is GPIOOPT2: the hand-written getter picks GPIO 18 or 25 at
  # runtime - a finite candidate set, not "anywhere", so the probe plan can
  # reason about it. Same for sma.enable below (GPIOOPT3: 5 or 33).
  - {positive: 32, negative: 33, precharge: 25, bms_power: [18, 25], second: 15, third: NC}
precharge_auto:
  - {hia4v1: 25, inverter_disconnect: 32}
sma:
  - {enable: [5, 33]}
sd_mmc:
  - {miso: setting, mosi: setting, clk: setting, cs: setting}
rgb_led:
  - {pin: 4}
equipment_stop:
  - {pin: 35}
battery_wakeup:
  - {wup1: 25, wup2: 32}
ap_button:
  - {pin: 0}
display_i2c:
  - {sda: setting, scl: setting}
comments:
  CHADEMO_CT_PIN: "// ADC2_CH3"
