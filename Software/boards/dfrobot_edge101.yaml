# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: dfrobot_edge101
class: DFRobotEdge101Hal
header: hw_dfrobot_edge101.h
macro: HW_DFROBOT_EDGE101
name: "DFRobot Edge101 IOT Controller"
rs485:
  - {tx: 17, rx: 36, de: 16}
can:
  - {driver: native, tx: 32, rx: 35}
sd_spi:
  - {mosi: 12, miso: 39, clk: 14, cs: 5, spi_bus: VSPI}
rgb_led:
  - {pin: 15}
ap_button:
  - {pin: 38}
# No comments: block. The original header carried its hardware notes as
# block comments above each group, which a trailing comment cannot
# reproduce verbatim - and board_verify_transcription.py is right to
# reject that. The facts moved into the header's descriptive comment,
# which sits outside the generated block and is left alone.
