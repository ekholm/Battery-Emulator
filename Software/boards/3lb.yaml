# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: 3lb
class: ThreeLBHal
header: hw_3LB.h
name: "3LB board"
buses:
  SPI1: {clk: 12, mosi: 5, miso: 34}
  SPI2: {clk: 17, mosi: 23, miso: 39}
rs485:
  - {tx: 1, rx: 3}
can:
  - {driver: native, tx: 27, rx: 26}
  - {driver: mcp2515, bus: SPI1, cs: 18, int: 35}
  - {driver: mcp2518fd, bus: SPI2, cs: 21, int: 34}
chademo:
  - {pin2: 12, pin10: 5, pin7: 34, pin4: 35, lock: 18, ct: 25}
contactors:
  - {positive: 32, negative: 33, precharge: 25, bms_power: 2, second: 13, third: NC}
precharge_auto:
  - {hia4v1: 25, inverter_disconnect: 32}
sma:
  - {enable: 36, led: NC}
sd_mmc:
  - {miso: 2, mosi: 15, clk: 14, cs: 13}
rgb_led:
  - {pin: 4, max_brightness: 40}
equipment_stop:
  - {pin: 35}
battery_wakeup:
  - {wup1: 25, wup2: 32}
