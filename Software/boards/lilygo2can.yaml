# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: lilygo2can
class: LilyGo2CANHal
header: hw_lilygo2can.h
macro: HW_LILYGO2CAN
name: "LilyGo T_2CAN"
buses:
  SPI1: {clk: variant, mosi: variant, miso: variant}
rs485:
  - {tx: 43, rx: 44}
can:
  - {driver: native, tx: 7, rx: 6}
  - {driver: mcp2515, bus: SPI1, cs: variant, int: variant, rst: variant, freq: 16000000}
  - {driver: mcp2518fd, bus: SPI1, cs: variant, int: variant, int0: variant, int1: variant, freq: is_fd() ? 40000000 : 0}
  - {driver: mcp2518fd, bus: SPI1, cs: variant, int: variant, spi_bus: DEFAULT_MCP2515_BUS}
chademo:
  - {pin2: 16, pin10: 15, pin7: 47, pin4: 4, lock: 40, ct: 5}
contactors:
  - {positive: 48, negative: 17, precharge: 21, bms_power: setting, second: 5, third: 4}
precharge_auto:
  - {hia4v1: 18, inverter_disconnect: 14}
sma:
  - {enable: 46}
rgb_led:
  - {pin: 35, max_brightness: 40}
equipment_stop:
  - {pin: setting}
battery_wakeup:
  - {wup1: setting, wup2: setting}
ap_button:
  - {pin: 0}
display_i2c:
  - {sda: setting, scl: setting}
comments:
  CHADEMO_CT_PIN: "// ADC1_CH4"
