# Board declaration - the source for the generated block in the header
# of the same name. Features own their pins; shared buses are declared
# once and referenced. A pin is a GPIO number, NC (the board does not
# have it), or setting/variant when the getter is chosen at runtime and
# stays hand-written below the generated block.
board: becom
class: BEComHal
header: hw_becom.h
macro: HW_BECOM
name: "BECom"
buses:
  SPI1: {clk: 12, mosi: 11, miso: 13}
rs485:
  - {tx: 15, rx: 17, de: 16}
can:
  - {driver: native, tx: 8, rx: 18}
  - {driver: mcp2518fd, bus: SPI1, cs: 14, int: 10, freq: 40000000, clkodiv: 0b00}
  - {driver: mcp2518fd, bus: SPI1, cs: 21, int: 9, freq: 40000000}
contactors:
  - {positive: 47, negative: 48, precharge: 45, bms_power: 1, second: 37}
precharge_auto:
  - {hia4v1: 45, inverter_disconnect: 47}
sma:
  - {enable: 3}
rgb_led:
  - {pin: 5, max_brightness: 40}
equipment_stop:
  - {pin: 46}
battery_wakeup:
  - {wup1: 2, wup2: 41}
ap_button:
  - {pin: 0}
