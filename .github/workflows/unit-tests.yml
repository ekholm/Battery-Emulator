name: ⚙️ Run Unit Tests


on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # battery_detects_capacity() decides whether the settings page offers a
    # Battery capacity edit. A driver that starts writing total_capacity_Wh
    # without being listed there would leave the user an edit that silently
    # reverts, which no compiler or unit test can catch. This does.
    - name: Check battery capacity detection list
      run: python3 tools/check_capacity_detection.py

    - name: Configure and build with CMake
      run: |
        cd test
        mkdir build
        cd build
        cmake ..
        cmake --build .

    - name: Run unit tests
      run: |
        cd test/build
        ctest

    # ctest is not enough on its own. test/CMakeLists.txt uses
    # gtest_discover_tests(), which registers every case as its own ctest test,
    # so each one runs in a fresh process and no global or static can leak
    # between them. That makes the step above structurally unable to see an
    # order dependency. Running the binary directly puts every case in one
    # process, the way a developer runs it, and shuffling then breaks any
    # remaining reliance on definition order.
    - name: Check order independence
      run: |
        cd test/build
        ./tests
        for seed in 1 7 42 1234 99999; do
          echo "--- shuffled, seed $seed ---"
          ./tests --gtest_shuffle --gtest_random_seed=$seed
        done

  board-declarations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      # Full history: the transcription check reads the board headers as they
      # were before this tooling existed, which a shallow clone does not have.
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Generated blocks are in sync with the declarations
      run: python3 tools/board_gen.py --check

    - name: Declarations still reproduce the original board headers
      run: python3 tools/board_verify_transcription.py

    # That check has an escape hatch for hardware the original headers never
    # had; this is the guard around it.
    - name: New-hardware exemptions are acknowledged and not stale
      run: python3 tools/test_transcription_verify.py

    - name: Capability validation rejects what it should
      run: python3 tools/test_board_validation.py

    - name: Probe-safety checker refuses what it should
      run: python3 tools/test_probe_plan.py

    # The report is checked in so that a pin change which makes a runtime probe
    # unsafe, or which collapses a distinction a cascade would rely on, arrives
    # as a diff to read rather than as a discovery on a bench.
    - name: Runtime probe plan is in sync with the declarations
      run: python3 tools/board_probe_plan.py --check
